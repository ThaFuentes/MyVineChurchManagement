<!-- Brief, detailed purpose: Simple 404 error page – prevents crash when static files (like CSS) are missing.
   Matches dark theme with cyan accents.
   CREATE THIS FILE (and folder) – fixes the TemplateNotFound crash in error handler. -->

<!DOCTYPE html>
<html lang="en" data-theme="cyan-glow">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | MyVineChurch.Online</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global/theme.css') }}?v=20260112">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global/base.css') }}?v=20260112">
  <style>
    body {
      background: var(--bg-page, linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%));
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 6rem 2rem;
    }
    h1 {
      font-size: 4rem;
      color: var(--primary);
      text-shadow: 0 0 25px var(--primary);
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.6rem;
      max-width: 800px;
      margin: 2rem auto;
    }
    a {
      color: var(--primary);
      text-decoration: none;
      font-size: 1.4rem;
    }
    a:hover {
      text-shadow: 0 0 15px var(--primary);
    }
  </style>
</head>
<body>
  <h1>404 - Page Not Found</h1>
  <p>The page you are looking for does not exist or has been moved.</p>
  <p><a href="{{ url_for('public.public_dashboard') }}">Return to Gathering Place →</a></p>
</body>
</html>
